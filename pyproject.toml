[project]
name = "cartbot"
version = "0.1.0"
description = "Discord bot for managing shared shopping lists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["cartbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
